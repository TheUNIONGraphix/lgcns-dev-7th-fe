<!doctype html>
<html lang="ko" data-path="/product">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/config.js"></script>
    <script src="js/guard.js"></script>
  </head>
  <body>
    <header class="site-header">
      <h1 class="logo">
        <a href="https://www.lgcns.com/" target="_blank" rel="noopener noreferrer">
          <img src="assets/logo.svg" alt="logo" width="100" height="100" />
        </a>
        <span class="logo-text">LGCNS</span>
      </h1>
      <nav class="global-nav" aria-label="Global">
        <ul class="desktop-nav">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
        <span class="login-status" data-login-status></span>
      </nav>
    </header>
    <div class="page-block">
      <h1 id="product-title"></h1>
      <p id="product-path"></p>
    </div>
    <script src="js/config.js"></script>
    <script src="js/auth-status.js"></script>
    <script>
      var category = new URLSearchParams(window.location.search).get("category") || "";
      var parts = category ? category.split("/") : [];
      document.querySelector("#product-title").textContent = parts.join("/");
      document.querySelector("#product-path").textContent = parts.join("");
    </script>
  </body>
</html>
