<!doctype html>
<html lang="ko" data-path="/login">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/config.js"></script>
    <script src="js/guard.js"></script>
  </head>
  <body>
    <main class="auth-screen">
      <section class="auth-card">
        <header>
          <h1>로그인</h1>
          <p>계정으로 로그인해주세요</p>
        </header>
        <form id="login-form">
          <label for="userId">
            아이디
            <input id="userId" name="userId" type="text" autocomplete="username" placeholder="아이디를 입력해주세요" />
          </label>
          <p id="userId-error" class="field-error" role="alert"></p>
          <label for="password">
            비밀번호
            <span class="password-row">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력해주세요" />
              <button type="button" data-password-toggle aria-pressed="false" aria-label="비밀번호 보기">보기</button>
            </span>
          </label>
          <p id="password-error" class="field-error" role="alert"></p>
          <div class="remember-row">
            <label>
              <input id="remember-id" type="checkbox" />
              아이디 저장하기
            </label>
            <button type="button">비밀번호 찾기 / 아이디 찾기</button>
          </div>
          <p id="login-error" class="field-error" role="alert"></p>
          <button type="submit">로그인</button>
        </form>
        <div class="auth-divider">또는</div>
        <button type="button" class="provider-google" data-provider="google">구글로 로그인</button>
        <button type="button" class="provider-kakao" data-provider="kakao">카카오로 로그인</button>
        <p>계정이 없으신가요? <a href="signup.html">회원가입</a></p>
      </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
